version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing configuration - edit these values for your project
  # SIGN_IDENTITY: "Developer ID Application: Your Company (TEAMID)"
  # KEYCHAIN_PROFILE: "my-notarize-profile"
  # ENTITLEMENTS: "build/darwin/entitlements.plist"

  # Docker image for cross-compilation (used when building on non-macOS)
  CROSS_IMAGE: wails-cross

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{if eq OS "darwin"}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT}}
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X ''skill-box/desktop/services.Version={{.VERSION | default "0.0.0-dev"}}'' -X ''skill-box/desktop/services.Commit={{.COMMIT | default "0"}}''"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=10.15"
      CGO_LDFLAGS: "-mmacosx-version-min=10.15"
      MACOSX_DEPLOYMENT_TARGET: "10.15"

  build:docker:
    summary: Cross-compiles for macOS using Docker (for Linux/Windows hosts)
    internal: true
    deps:
      - task: common:build:frontend
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.GO_CACHE_MOUNT}} {{.REPLACE_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Mount Go module cache for faster builds
      GO_CACHE_MOUNT:
        sh: 'echo "-v ${GOPATH:-$HOME/go}/pkg/mod:/go/pkg/mod"'
      # Extract replace directives from go.mod and create -v mounts for each
      # Handles both relative (=> ../) and absolute (=> /) paths
      REPLACE_MOUNTS:
        sh: |
          grep -E '^replace .* => ' go.mod 2>/dev/null | while read -r line; do
            path=$(echo "$line" | sed -E 's/^replace .* => //' | tr -d '\r')
            # Convert relative paths to absolute
            if [ "${path#/}" = "$path" ]; then
              path="$(cd "$(dirname "$path")" 2>/dev/null && pwd)/$(basename "$path")"
            fi
            # Only mount if directory exists
            if [ -d "$path" ]; then
              echo "-v $path:$path:ro"
            fi
          done | tr '\n' ' '

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:go:
    summary: Creates universal binary using wails3 tool lipo (Linux/Windows)
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle


  create:app:bundle:
    summary: Creates an `.app` bundle
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      - task: '{{if eq OS "darwin"}}codesign:adhoc{{else}}codesign:skip{{end}}'

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle (macOS only)
    internal: true
    cmds:
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  codesign:skip:
    summary: Skips codesigning when cross-compiling
    internal: true
    cmds:
      - 'echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."'

  # ---- DMG 打包(零第三方依赖,只 hdiutil + osascript) ----
  # scripts/build-dmg.sh 内会调 `wails3 task darwin:package[:universal]`,
  # 但这里仍显式声明 deps,让 task 的增量判断工作正常。
  # 注意:wails3 task 不支持 task 名里再带 ':' (会被解析成嵌套 key),
  # 所以变体用 '-' 分隔(dmg-universal / dmg-arm64 / dmg-amd64 / dmg-skip-build)。
  #
  # ⚠️ wails3 alpha.60 build 看 bin/skill-box 已存在会报
  # "build output already exists and is not an object file",所以 dmg 任务
  # deps 第一项必须是 clean:stale(清掉上一次残留的 binary + .app + staging.dmg),
  # 否则 build:native 在 deps 阶段就挂,dmg 的 cmds 跑不到 rm。
  #
  # dmg 跑完会再清一次 bin/skill-box(已拷进 .app),保证日常 dev 链起点干净。
  clean:stale:
    summary: 清 dmg / build 残留产物(bin/skill-box / .app / staging.dmg)
    desc: |
      上一次 dmg 跑挂时 trap 没机会清 staging,bin/skill-box 残留会让
      wails3 alpha.60 build DEV=true 报 "build output already exists
      and is not an object file"。这里在 dmg build 链之前强制清一遍。
    cmds:
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}.dmg.staging.dmg"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-arm64.dmg.staging.dmg"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64.dmg.staging.dmg"
      # 不删 .dmg 产物 —— 用户可能已经分发出去,下次重跑 dmg-arm64 不应该
      # 把 dmg-amd64.dmg 也干掉。各自 task 末尾自己清自己的 .dmg。
      - rm -rf "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - rm -rf "{{.BIN_DIR}}/{{.APP_NAME}}-arm64.app"
      - rm -rf "{{.BIN_DIR}}/{{.APP_NAME}}-amd64.app"

  dmg:
    summary: 把 `.app` 包成可拖拽 DMG(默认 universal)
    desc: |
      调用 scripts/build-dmg.sh 生成 Finder 可拖拽布局的 DMG。
      零三方依赖,只用 macOS 自带 hdiutil + osascript。
      产物默认 {{.BIN_DIR}}/{{.APP_NAME}}.dmg。
    deps:
      - task: clean:stale
      - task: package
    cmds:
      - bash scripts/build-dmg.sh --arch universal --output "{{.BIN_DIR}}/{{.APP_NAME}}.dmg"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}"   # 已拷进 .app,留着会污染 wails3 dev 起点

  dmg-universal:
    summary: 把 universal `.app` 包成可拖拽 DMG
    deps:
      - task: clean:stale
      - task: package:universal
    cmds:
      - bash scripts/build-dmg.sh --arch universal --output "{{.BIN_DIR}}/{{.APP_NAME}}.dmg"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}"

  dmg-arm64:
    summary: 把 arm64 `.app` 包成可拖拽 DMG(Apple Silicon Mac 用)
    desc: |
      单独打 arm64-only dmg。Apple Silicon Mac 上启动用本架构 native,
      避免 universal binary 在 arm Mac 上偶尔走 x86_64 slice 走 Rosetta 的问题。
      产物 {{.BIN_DIR}}/{{.APP_NAME}}-arm64.dmg(里面 .app 文件夹固定叫
      {{.APP_NAME}}.app,不带 -arm64 后缀 —— 拖到 /Applications 后用户在
      Finder/Dock 看到的就是干净的 Skill-Box.app)。
      macOS 26 Gatekeeper 对纯 --sign - 签的 binary 报"损坏或不完整",
      这里 binary + .app 两段签,都带 entitlements + --options runtime。
    deps:
      - task: clean:stale
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 CGO_CFLAGS="-mmacosx-version-min=10.15" CGO_LDFLAGS="-mmacosx-version-min=10.15" MACOSX_DEPLOYMENT_TARGET="10.15" go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}-arm64" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      # 1) 先签 binary(binary 必须带 entitlements,macOS 26 Gatekeeper 在
      #    LaunchServices 校验时会看 binary 的 entitlements 段,空的话直接
      #    报"损坏或不完整",双击/LaunchServices 启动全部静默拒绝)
      - codesign --force --sign - --entitlements build/darwin/entitlements.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"
      # 2) 再签 .app(--deep 把上面 binary 的签名带过去;不带 --options runtime,
      #    ad-hoc + hardened runtime 在 macOS 26 上更严,反而触发"损坏"误报)
      - codesign --force --deep --sign - --entitlements build/darwin/entitlements.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - bash scripts/build-dmg.sh --skip-build --arch arm64 --output "{{.BIN_DIR}}/{{.APP_NAME}}-arm64.dmg"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-arm64.dmg.staging.dmg"

  dmg-amd64:
    summary: 把 amd64 `.app` 包成可拖拽 DMG(Intel Mac 用)
    desc: |
      单独打 x86_64-only dmg。Intel Mac 上启动用本架构 native,
      用户可能没装 Rosetta,这种 dmg 能保证启动。
      产物 {{.BIN_DIR}}/{{.APP_NAME}}-amd64.dmg(里面 .app 文件夹固定叫
      {{.APP_NAME}}.app,不带 -amd64 后缀)。
      macOS 26 Gatekeeper 处理同 dmg-arm64。
    deps:
      - task: clean:stale
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 CGO_CFLAGS="-mmacosx-version-min=10.15" CGO_LDFLAGS="-mmacosx-version-min=10.15" MACOSX_DEPLOYMENT_TARGET="10.15" go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      # 1) 先签 binary
      - codesign --force --sign - --entitlements build/darwin/entitlements.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"
      # 2) 再签 .app
      - codesign --force --deep --sign - --entitlements build/darwin/entitlements.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - bash scripts/build-dmg.sh --skip-build --arch amd64 --output "{{.BIN_DIR}}/{{.APP_NAME}}-amd64.dmg"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64.dmg.staging.dmg"

  dmg-skip-build:
    summary: 假设 `.app` 已存在,只重写 dmg 布局(快速迭代)
    desc: |
      跳过 wails3 build,只重写 dmg 内 Finder 布局。
      调 AppleScript 改布局时用这个任务,比 dmg 快很多。
    deps:
      - task: package
    cmds:
      - bash scripts/build-dmg.sh --arch universal --skip-build --output "{{.BIN_DIR}}/{{.APP_NAME}}.dmg"
      # skip-build 不依赖 package:universal,这里 bin/skill-box 可能是用户手动 build 的产物,不删

  run:
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}'

  sign:
    summary: Signs the application bundle with Developer ID
    desc: |
      Signs the .app bundle for distribution.
      Configure SIGN_IDENTITY in the vars section at the top of this file.
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" --identity "{{.SIGN_IDENTITY}}" {{if .ENTITLEMENTS}}--entitlements {{.ENTITLEMENTS}}{{end}}
    preconditions:
      - sh: '[ -n "{{.SIGN_IDENTITY}}" ]'
        msg: "SIGN_IDENTITY is required. Set it in the vars section at the top of build/darwin/Taskfile.yml"

  sign:notarize:
    summary: Signs and notarizes the application bundle
    desc: |
      Signs the .app bundle and submits it for notarization.
      Configure SIGN_IDENTITY and KEYCHAIN_PROFILE in the vars section at the top of this file.

      Setup (one-time):
        wails3 signing credentials --apple-id "you@email.com" --team-id "TEAMID" --password "app-specific-password" --profile "my-profile"
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" --identity "{{.SIGN_IDENTITY}}" {{if .ENTITLEMENTS}}--entitlements {{.ENTITLEMENTS}}{{end}} --notarize --keychain-profile {{.KEYCHAIN_PROFILE}}
    preconditions:
      - sh: '[ -n "{{.SIGN_IDENTITY}}" ]'
        msg: "SIGN_IDENTITY is required. Set it in the vars section at the top of build/darwin/Taskfile.yml"
      - sh: '[ -n "{{.KEYCHAIN_PROFILE}}" ]'
        msg: "KEYCHAIN_PROFILE is required. Set it in the vars section at the top of build/darwin/Taskfile.yml"
